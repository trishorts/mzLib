# ONE-OFF job, on a throwaway branch only: generates frozen R reference outputs for mzLib's
# LogisticRegression, MixedModel, SpearmanCorrelation and PValueCombination. Never merged.
name: statistics-glm-lmm-fixtures

on:
  push:
    branches: [ci/statistics-glm-lmm-fixtures]

jobs:
  fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Generate fixtures
        run: Rscript mzLib/Test/Statistics/ReferenceData/make_glm_lmm_fixtures.R out
      - uses: actions/upload-artifact@v4
        with:
          name: statistics-glm-lmm-fixtures
          path: out/
